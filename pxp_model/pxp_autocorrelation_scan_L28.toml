# L=28 full-ensemble autocorrelations on C064M1024G (64 CPUs, 1024 GiB/node).
# Default submission runs L<=26 first, then this scan in the same 8-node job:
# sbatch pxp_model/submit_autocorrelation.sh
# Only L=28: sbatch pxp_model/submit_autocorrelation_L28.sh
# For one node, add --nodes=1 --ntasks=1 before the script path.
sizes = [28]
# 51 fields plus m=0.655 appended by critical=true (52 total).
ms = { start = 0.0, stop = 1.0, length = 51, scale = "linear", critical = true }
# 101 log temperatures from 0.01 to 1.0 plus T=0 appended by zero=true (102 total).
# Both flags default to false and skip values already present.
# ms and temperatures are then sorted ascending, with T=0 first.
temperatures = { start = -2.0, stop = 0.0, length = 101, scale = "log10", zero = true }
real_times = { start = -1, stop = 4, length = 201, scale = "log10" }
imaginary_times = { start = -1, stop = 4, length = 201, scale = "log10" }
# At T>0: tau = ts/max(ts)/(2*T); at T=0: tau = ts unchanged.
# NPZ stores the actual 2D imaginary_times and the 1D imaginary_times_input.

# Each (L,m) worker holds all independent momentum eigensystems.
# Estimated peak: 271.1 GiB/worker; two workers + parent: 542.7 GiB/node.
# 2 workers * 32 threads = 64 CPUs/node; retain headroom for unmeasured RSS.
workers = 2
threads = 32
# Reserve 64 GiB of nominal node RAM; a smaller Slurm limit takes precedence.
# Estimates include solver workspace and a 25% margin, but are not RSS bounds.
memory_gib = 960.0
output_dir = "data/autocorrelation"
