# Shared by run.jl and run_slurm.jl. Defaults match the former local demo.
# For a full scan: sizes = [16, 32, 64, 128], nsamples = 10000.
sizes = [32, 64, 128, 256]
nsamples = 50000
seed = 1996
field_distribution = "fixed" # uniform | fixed
offset = true # true: subtract the lowest odd-parity transition; false: full autocorrelation

# Arrays or ranges; log10 start/stop are base-10 exponents.
fields = { start = -1, stop = 1, length = 101, scale = "log10" }
times = { start = -1, stop = 4, length = 201, scale = "log10" }

worker_threads = 8 # Match Slurm --cpus-per-task; local threads use julia --threads.
# Relative to this TOML file; a timestamp is appended before the extension.
output = "results/Lmax256_fixed.h5"
